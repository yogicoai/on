
    <style>
        :root {
            --brand-color: #AA4B76;
            --grad-start: #F59CC8;
            --grad-end: #FF7CB7;
        }

        .donation-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
        }

        .image-slice {
            width: 100%;
            font-size: 0;
            line-height: 0;
        }
        .image-slice img {
            width: 100%;
            display: block;
        }

        .grap-section {
            position: relative;
            width: 100%;
            height: 35dvh;
        }
        
        .grap-section img { height: 100%; }
        
        .grap-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 82%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .grap-text {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3%;
        }
        
        .grap-title-area {
            display: flex;
            align-items: center;
            flex-wrap: wrap; 
            gap: 10px;
        }

        .grap-title, .grap-percent {
            font-size: clamp(16px, 4.5vw, 28px); 
            font-weight: 800;
            color: var(--brand-color);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .grap-buyers {
            font-size: clamp(12px, 3vw, 15px);
            font-weight: 700;
            color: var(--grad-end); 
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: -0.02em;
        }

        .grap-track {
            width: 100%;
            height: clamp(18px, 5vw, 33px); 
            background-color: #ffffff;
            border-radius: 154px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03), 0 2px 10px rgba(255,124,183,0.15);
        }

        .grap-fill {
            height: 100%;
            width: 0%;
            border-radius: 154px;
            background: linear-gradient(83deg, var(--grad-start) 0%, var(--grad-end) 70%, var(--grad-end) 100%);
            transition: width 1.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .buyer-badge-wrapper {
            display: flex;
            flex-direction: column; 
            align-items: center;
            height: 180px; 
            overflow: hidden;
        }

        /* 🚀 개별 뱃지 기본 설정: 2, 3번째 뱃지의 기본 너비 */
        .buyer-badge {
            display: flex;
            align-items: center;
            justify-content: center; /* 텍스트 가운데 정렬 추가 */
            gap: 8px;
            background-color: #ffffff;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 124, 183, 0.2); 
            font-size: clamp(13px, 3.5vw, 15px);
            
            margin-top: 12px;
            height: 44px; 
            box-sizing: border-box;

            /* 기본 너비 (2번, 3번 뱃지) */
            width: 210px; 
            padding: 8px 10px;

            /* 🚀 너비가 변경될 때 부드럽게 늘어나도록 transition 추가 */
            transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: badgeEnter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* 🚀 첫 번째로 올라간 뱃지가 가질 스타일 (가로로 길어짐) */
        .buyer-badge.is-top {
            width: 250px; /* 1번 뱃지일 때의 너비 (더 길게) */
        }

        .buyer-badge.fade-out {
            animation: badgeExit 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes badgeEnter {
            0%   { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes badgeExit {
            0%   { opacity: 1; height: 44px; margin-top: 12px; padding-top: 8px; padding-bottom: 8px; transform: translateY(0) scale(1); }
            100% { opacity: 0; height: 0px; margin-top: 0px; padding-top: 0px; padding-bottom: 0px; transform: translateY(-20px) scale(0.9); border: none; }
        }

        .buyer-name {
            font-weight: 700;
            color: #333333;
            white-space: nowrap;
        }

        .buyer-action {
            font-weight: 700;
            color: var(--brand-color);
        }
    </style>
</head>
<body>

<div class="donation-container">
    <div class="image-slice">
        <img src="/web/img/0310/page_01.png" alt=""/>
    </div>

    <div class="image-slice grap-section">
        <img src="/web/img/0310/page_02.png" alt=""/>
        
        <div class="grap-overlay">
            <div class="grap-text">
                <div class="grap-title-area">
                    <div class="grap-title">누적 금액</div>
                    <div class="grap-buyers" id="currentBuyers">지금까지 0분께서 함께해주셨어요</div>
                </div>
                <div class="grap-percent" id="currentPercent">0%</div>
            </div>
            <div class="grap-track">
                <div class="grap-fill" id="progressFill"></div>
            </div>

            <div class="buyer-badge-wrapper" id="badgeWrapper">
            </div>
        </div>
    </div>

    <div class="image-slice">
        <img src="/web/img/0310/page_03.png" alt=""/>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // ── 누적 금액 % · 참여 인원 — 서버에서 불러오지 않고 아래 숫자로 정한다(2026-10-14 변경) ──
    //   기준일의 값에서 시작해 4일마다 1%씩 올라가고, 종료일(10월 31일) 값에서 멈춘다.
    //   기준값 = 2026-10-14 에 전체 데이터(온라인 전체 몰 + 오프라인 매장)로 다시 계산한 값:
    //     대상 상품 판매 9억 1,239만 원 − 반품 3,923만 원 = 8억 7,316만 원 → 그 1% = 873만 원 ÷ 목표 3,000만 원 = 29.1%
    //     참여 = 판매 금액이 있는 주문 4,600건(온라인 1,328 + 오프라인 3,272). 기간 2026-03-01 ~ 10-14.
    //   예전에는 /api/awesome-people/summary 의 금액을 목표로 나눠 매번 불러왔다(그날 화면 값은 24% · 5,901분 — 줄라가 대부분 빠지고 수량으로 센 값).
    const BASE_DATE = '2026-10-14';   // 기준일
    const BASE_PERCENT = 29;          // 기준일의 누적 %
    const STEP_DAYS = 4;              // 며칠마다
    const STEP_PERCENT = 1;           // 몇 %씩 올릴지
    const END_DATE = '2026-10-31';    // 종료일 — 이날 값에서 멈춘다
    const BUYERS_COUNT = 4600;        // "지금까지 N분" — 기준일의 참여 주문 건수. 바꾸려면 이 숫자만 고친다

    // 아래 뱃지("○○○님 기부 완료")에 쓰는 구매자 목록 — 이것만 서버에서 받는다
    const CAFE24_BUYERS_API_URL = 'https://port-0-admichat-lzgmwhc4d9883c97.sel4.cloudtype.app/api/cafe24/awesome-buyers';

    let globalBuyersList = [];
    let currentBuyerIndex = 0;
    let badgeInterval = null;

    function getDateStrings() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return { start: `${year}-03-10`, end: `${year}-${month}-${day}` };
    }

    function maskUserId(userId) {
        if (!userId) return "익명";
        const namePart = userId.split('@')[0];
        if (namePart.length <= 3) return namePart + '***';
        return namePart.substring(0, 3) + '***';
    }

    // 오늘(한국 시간) 기준 누적 % — 기준일 값 + (지난 날 수 ÷ 4)%. 종료일이 지나면 종료일 값 그대로
    function currentPercent() {
        const DAY = 86400000;
        const at = (s) => Date.parse(s + 'T00:00:00Z');
        const todayKST = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
        const until = Math.min(at(todayKST), at(END_DATE));
        const days = Math.max(0, Math.round((until - at(BASE_DATE)) / DAY));
        const percent = BASE_PERCENT + Math.floor(days / STEP_DAYS) * STEP_PERCENT;
        return Math.min(100, percent);
    }

    // 뱃지에 쓸 구매자 목록만 불러온다 — 실패해도 위쪽 숫자는 그대로 보인다
    async function fetchBuyers() {
        try {
            const dates = getDateStrings();
            const buyersRes = await axios.get(`${CAFE24_BUYERS_API_URL}?startDate=${dates.start}&endDate=${dates.end}`);
            const buyersData = buyersRes.data;
            const rawBuyersList = (buyersData && buyersData.success) ? (buyersData.buyers || []) : [];

            globalBuyersList = rawBuyersList.map(id => maskUserId(id));
            if (globalBuyersList.length > 0) {
                startBadgeRolling();
            }
        } catch (error) {
            console.error('구매자 목록 조회 실패:', error);
        }
    }

    function updateUI(percent, quantity) {
        document.getElementById('currentPercent').innerText = percent + '%';
        document.getElementById('currentBuyers').innerText = `지금까지 ${quantity.toLocaleString()}분께서 함께해주셨어요`;

        setTimeout(() => {
            document.getElementById('progressFill').style.width = percent + '%';
        }, 100);
    }

    function startBadgeRolling() {
        const wrapper = document.getElementById('badgeWrapper');
        if (!wrapper) return;

        if (badgeInterval) clearInterval(badgeInterval);

        const popBadge = () => {
            if (globalBuyersList.length === 0) return;

            const buyerName = globalBuyersList[currentBuyerIndex];
            currentBuyerIndex = (currentBuyerIndex + 1) % globalBuyersList.length;

            const badge = document.createElement('div');
            badge.className = 'buyer-badge';
            
            // 하트 이미지가 너무 커지지 않도록 인라인 스타일로 높이 고정
            badge.innerHTML = `
                <span><img src="/web/img/heart.png" style="height: 14px; vertical-align: middle;" /></span>
                <span class="buyer-name">${buyerName}님</span>
                <span class="buyer-action">기부 완료</span>
            `;

            wrapper.appendChild(badge);

            // 🚀 핵심: 방금 생성한 요소가 첫 번째 요소라면(초기 세팅 시), 바로 넓게 만들어줌
            if (wrapper.children.length === 1) {
                badge.classList.add('is-top');
            }

            // 🚀 4개가 되는 순간 제일 위 녀석을 아웃시키고, 다음 타자를 1등석(넓어짐)으로 승격
            if (wrapper.children.length > 3) {
                const oldestBadge = wrapper.firstElementChild; 
                
                oldestBadge.classList.add('fade-out');
                
                // 새로운 1등석이 될 두 번째 요소에게 .is-top 클래스 부여 (CSS width transition 자동 실행)
                const newTopBadge = wrapper.children[1];
                if (newTopBadge) {
                    newTopBadge.classList.add('is-top');
                }
                
                setTimeout(() => {
                    if (oldestBadge.parentNode === wrapper) {
                        oldestBadge.remove();
                    }
                }, 500);
            }
        };

        popBadge();
        setTimeout(popBadge, 200);
        setTimeout(popBadge, 400);
        
        badgeInterval = setInterval(popBadge, 2000); 
    }

    updateUI(currentPercent(), BUYERS_COUNT); // 숫자는 불러오지 않고 바로 표시
    fetchBuyers();
</script>
