<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일 모니터링 · 요기보</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  일일 모니터링 메일 페이지 — 매일 이 페이지를 통째로 캡처해 메일로 보낸다.
    ① 어제 한눈에(매출·목표 대비 온라인 몰별/오프라인 매장별·경보) · ② 자사몰/스마트스토어 KPI · ③ 오프라인 좌수 · ④ 재고 주의(품번 기준, MD 양식)
    ① 온오프 매출·샐리필은 기존 메일(photo.js) 그대로.
  데이터: /api/daily-mail (lib/dailyMail.js). 주소 파라미터:
    ?date=YYYY-MM-DD  기준일(기본 어제)   ?basis=online  재고 예상판매를 온라인만으로(기본 온+오프)
    ?fresh=1          캐시 없이 새로 계산   ?capture=1     캡처용(상단 조작줄 숨김·폭 고정)
  렌더가 끝나면 <body data-ready="1"> — 캡처 스크립트는 이것을 기다린다.
  메일 이미지라 라이트 테마로 고정한다(받는 쪽 다크 모드와 무관하게 같은 그림).
-->
<style>
  :root{
    color-scheme:light;
    /* 토스풍 — 밝은 회색 바탕 · 흰 카드 · 파랑 포인트(2026-10-01, 이전 베이지 팔레트 교체) */
    --page:#f2f4f6; --card:#ffffff; --card-2:#f9fafb; --ink:#191f28; --ink-2:#4e5968; --ink-3:#8b95a1;
    --line:#f2f4f6; --line-2:#e5e8eb; --pill:#3182f6; --pill-ink:#ffffff;
    --c-vol:#3182f6; --c-rev:#f06c00; --seq-3:#3182f6;
    --good:#03a65a; --good-bg:#e5f7ed; --bad:#f04452; --bad-bg:#feeced;
    --warn:#e87b00; --warn-bg:#fff3e0;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); color:var(--ink);
    font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; letter-spacing:-.01em;
    font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px; margin:0 auto; padding:22px 20px 40px;}
  body.capture .wrap{width:1040px; max-width:none; padding:20px 20px 24px;}
  body.capture .tools{display:none;}
  .tnum{font-variant-numeric:tabular-nums;}

  .top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin:0 0 4px;}
  h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-.01em;}
  h1 b{color:var(--c-vol);}
  .fresh{margin:5px 0 0; font-size:12px; color:var(--ink-2);}
  .tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .tools input,.tools select,.tools button{font:inherit; font-size:12.5px; padding:6px 10px; border:1px solid var(--line-2); border-radius:9px; background:var(--card); color:var(--ink);}
  .tools button{cursor:pointer; font-weight:600;}
  .tools button.primary{background:var(--pill); color:var(--pill-ink); border-color:var(--pill);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:12px;}
  .card-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .card-head h2{margin:0; font-size:15px; font-weight:800;}
  .card-head .no{display:inline-flex; width:20px; height:20px; border-radius:6px; background:var(--pill); color:var(--pill-ink); font-size:11.5px; font-weight:800; align-items:center; justify-content:center; margin-right:2px; vertical-align:1px;}
  .card-head .sub{font-size:12px; color:var(--ink-2);}
  .chip{display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:1px 8px; border-radius:20px; white-space:nowrap;}
  .chip.up{color:var(--good); background:var(--good-bg);}
  .chip.dn{color:var(--bad); background:var(--bad-bg);}
  .chip.warn{color:var(--warn); background:var(--warn-bg);}
  .chip.na{color:var(--ink-3); background:var(--card-2); border:1px dashed var(--line-2);}
  .note{font-size:11.5px; color:var(--ink-3); margin:8px 0 0; line-height:1.6;}
  .err{font-size:12.5px; color:var(--bad); background:var(--bad-bg); border-radius:10px; padding:10px 12px;}

  /* 어제 매출 + 경보 */
  .sales{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;}
  .k{background:var(--card-2); border:1px solid var(--line); border-radius:11px; padding:10px 12px;}
  .k .kl{font-size:11.5px; color:var(--ink-2); margin:0 0 3px;}
  .k .kv{font-size:19px; font-weight:800; letter-spacing:-.02em;}
  .k .kd{font-size:11.5px; color:var(--ink-2); margin-top:2px;}
  .alerts{list-style:none; margin:0; padding:0; display:grid; gap:5px;}
  .alerts li{display:flex; gap:8px; align-items:baseline; font-size:12.5px; padding:7px 10px; border-radius:9px; background:var(--card-2); border-left:3px solid var(--warn);}
  .alerts li.bad{border-left-color:var(--bad);}
  .alerts .area{font-weight:800; min-width:34px;}
  .alerts.ok li{border-left-color:var(--good);}

  /* KPI */
  .two{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .ch{border:1px solid var(--line-2); border-radius:12px; padding:12px 14px; background:var(--card);}
  .ch h3{margin:0 0 8px; font-size:14px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .pace{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px;}
  .pace .k .kv{font-size:16px;}
  .bar{position:relative; height:9px; border-radius:5px; background:var(--line); overflow:hidden; margin:2px 0 10px;}
  .bar i{position:absolute; left:0; top:0; height:100%; border-radius:5px; display:block;}
  .bar .mk{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink-2);}
  table.t{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.t th{font-size:11px; font-weight:700; color:var(--ink-2); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line-2); background:var(--card-2); white-space:nowrap;}
  table.t td{padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.t .r{text-align:right;}
  table.t .c{text-align:center;}
  table.t tr.sum td{font-weight:800; background:var(--card-2); border-top:1px solid var(--line-2);}
  table.t td.neg{color:var(--bad); font-weight:700;}
  table.t tr.sub td{color:var(--ink-2); font-size:12px; padding-top:3px; padding-bottom:3px;}
  table.t tr.sub td:first-child{padding-left:16px;}
  .note-in{font-size:10.5px; color:var(--ink-3);}
  /* 기간 보기(화면 전용) — 메일 캡처에는 나오지 않는다 */
  .range-tools{margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-2); flex-wrap:wrap;}
  .range-tools input,.range-tools button{font:inherit; font-size:12px; padding:3px 7px; border:1px solid var(--line-2); border-radius:7px; background:var(--card); color:var(--ink);}
  .range-tools button{cursor:pointer; font-weight:600;}
  .range-tools #r-go{background:var(--pill); color:var(--pill-ink); border-color:var(--pill);}
  body.capture .range-tools{display:none;}
  .tiles-span{margin:0 0 8px; font-size:12.5px; color:var(--ink-2);}
  sup.fb{color:var(--warn); font-weight:800; margin-left:1px;}
  /* 온라인팀 업데이트 전 — 표 칸 표시(빈 칸이 시스템 오류가 아님을 눈에 띄게) */
  .chip.pending{color:var(--warn); background:var(--warn-bg); border:1px solid rgba(180,118,0,.35);}
  .two.tgt{margin-bottom:6px;}
  /* 두 칸을 정확히 반씩 — 긴 몰 이름이 한쪽 칸을 키워 옆 칸이 카드 밖으로 밀려나지 않게(2026-10-01 캡처에서 13px 넘침) */
  .two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .two.tgt table.t td:first-child{white-space:normal; word-break:keep-all;}
  /* 원 단위(9자리 숫자)라 숫자 칸이 넓다 — 목표 표만 글자·여백을 줄여 이름 칸을 확보 */
  .two.tgt table.t{font-size:12px;}
  .two.tgt table.t th, .two.tgt table.t td{padding-left:5px; padding-right:5px;}
  .two.tgt table.t tr.sub td:first-child{padding-left:10px;}
  .two.tgt .ch{padding:12px 12px;}
  .sub-h{margin:16px 0 8px; font-size:13.5px; font-weight:800;}
  /* 샐리필 "+ 일별 보기" — 메일 캡처에는 버튼이 나오지 않는다 */
  .sally-h{margin:16px 0 8px; display:flex; align-items:center; gap:8px;}
  .plus-btn{font:inherit; font-size:11.5px; font-weight:700; padding:3px 9px; border:1px solid var(--line-2); border-radius:8px; background:var(--card-2); color:var(--c-vol); cursor:pointer;}
  .plus-btn:hover{border-color:var(--c-vol);}
  body.capture .plus-btn{display:none;}
  .pop{position:fixed; inset:0; background:rgba(33,30,25,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .pop-card{background:var(--card); border-radius:14px; width:min(860px,100%); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .pop-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line);}
  .pop-head b{font-size:15px;}
  .pop-head button{font:inherit; font-size:18px; border:none; background:none; cursor:pointer; color:var(--ink-2);}
  .pop-body{padding:12px 18px 18px; overflow:auto;}
  .pop-body h4{margin:12px 0 6px; font-size:13px;}
  .two.staff table.t td{padding-top:4px; padding-bottom:4px;}
  .twrap{overflow-x:auto;}

  /* 재고 — MD 양식 표 */
  table.stock th{background:#fff; color:var(--ink); border:1px solid #9a958b; text-align:center; font-size:12px;}
  table.stock td{border:1px solid #c9c4b9; text-align:center;}
  table.stock td.l{text-align:left;}
  .judge{font-weight:800; color:var(--bad);}
  .inner-tag{font-size:10.5px; color:var(--ink-3); margin-left:4px;}
  /* 주의 품목 기준 설명 — 표 위 */
  .rule-box{background:var(--card-2); border:1px solid var(--line-2); border-radius:10px; padding:10px 14px; margin:0 0 10px; font-size:12px; line-height:1.65;}
  .rule-box .rb-t{font-size:13px;}
  .rule-box ol{margin:4px 0 6px 18px; padding:0;}
  .rule-box ul{margin:2px 0 0 16px; padding:0;}
  .rule-box .rb-ex{color:var(--ink-2); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:0 6px; margin-left:4px; white-space:nowrap;}
  .rule-box .rb-ex b{color:var(--bad);}
  .rb-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px; border-top:1px dashed var(--line-2); padding-top:6px;}
  .soldout{margin-top:10px; font-size:12.5px; background:var(--card-2); border-radius:10px; padding:9px 12px; line-height:1.7;}

  /* ── 토스풍 모양 — 테두리 대신 여백·둥근 모서리, 큰 숫자 ── */
  .wrap{padding-top:26px;}
  .eyebrow{color:var(--ink-3); letter-spacing:.08em;}
  h1{font-size:23px; font-weight:700; letter-spacing:-.03em;}
  .fresh{color:var(--ink-3);}
  .tools input,.tools select,.tools button,.range-tools input,.range-tools button{border:0; background:#e9ecef; color:var(--ink-2); border-radius:10px;}
  .tools button.primary,.range-tools #r-go{background:var(--pill); color:#fff;}
  .card{border:0; border-radius:20px; padding:22px 24px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,27,55,.05);}
  .card-head{margin-bottom:14px;}
  .card-head h2{font-size:17px; font-weight:700; letter-spacing:-.02em;}
  .card-head .no{width:22px; height:22px; border-radius:7px; background:#e8f3ff; color:var(--c-vol); font-weight:700;}
  .card-head .sub{color:var(--ink-3);}
  .k{background:var(--card-2); border:0; border-radius:14px; padding:14px 16px;}
  .k .kl{color:var(--ink-3); font-weight:500;}
  .k .kv{font-size:21px; font-weight:700; letter-spacing:-.03em;}
  .k .kd{color:var(--ink-2);}
  .ch{border:1px solid #eef1f4; border-radius:16px; padding:16px;}
  .ch .k{background:var(--card-2);}
  .ch h3{font-size:15px; font-weight:700;}
  .chip{border-radius:8px; padding:2px 8px; font-weight:600;}
  .chip.na{border:0; background:#f2f4f6;}
  .chip.pending{border:0;}
  table.t th{background:transparent; color:var(--ink-3); font-weight:600; border-bottom:1px solid var(--line-2);}
  table.t td{border-bottom:1px solid #f2f4f6;}
  table.t tr.sum td{background:var(--card-2); border-top:0;}
  table.t td.neg{color:var(--bad);}
  .bar{background:#eef1f4; height:8px;}
  .alerts{gap:6px;}
  .alerts li{border-left:0; background:var(--card-2); border-radius:12px; padding:10px 12px;}
  .alerts .area{color:var(--ink);}
  table.stock th{background:var(--card-2); color:var(--ink-2); border:1px solid var(--line-2); font-weight:600;}
  table.stock td{border:1px solid #eef1f4;}
  .rule-box{border:0; border-radius:14px; padding:14px 16px;}
  .rule-box .rb-ex{border:0; background:#fff;}
  .rb-cols{border-top:1px solid var(--line-2);}
  .soldout{border-radius:14px; padding:12px 14px;}
  .plus-btn{border:0; background:#e8f3ff; color:var(--c-vol); border-radius:8px;}
  .pop{background:rgba(0,0,0,.4);}
  .pop-card{border-radius:20px;}
  sup.fb{color:var(--warn);}
  .tiles-span{color:var(--ink-3);}
  .inner-tag{color:var(--ink-3);}

  @media (max-width:760px){ .two{grid-template-columns:1fr;} .sales{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <p class="eyebrow">Yogibo Daily Monitoring</p>
      <h1>일일 모니터링 <b id="hd-date">—</b></h1>
      <p class="fresh" id="hd-fresh">불러오는 중…</p>
    </div>
    <div class="tools">
      <select id="f-basis" aria-label="재고 판매 기준">
        <option value="">재고: 온+오프 판매 기준</option>
        <option value="online">재고: 온라인 판매만</option>
      </select>
      <button type="button" class="primary" id="f-fresh" title="캐시 없이 지금 데이터로 다시 계산">↻ 새로 계산</button>
    </div>
  </div>
  <div id="root"></div>
</div>
<div class="pop" id="sallyPop" onclick="if(event.target===this)closeSally()">
  <div class="pop-card" role="dialog" aria-label="샐리필 일별 매출">
    <div class="pop-head"><b>샐리필 — 이번 달 일별 매출</b><button type="button" onclick="closeSally()" aria-label="닫기">✕</button></div>
    <div class="pop-body"></div>
  </div>
</div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  // dash 홈 "일일 모니터링" 안에 iframe 으로 들어간 경우 — 높이를 부모에 알려 iframe 을 페이지 길이에 맞춘다
  var EMBED = window.self !== window.top;
  function postHeight(){
    if (!EMBED) return;
    try { window.parent.postMessage({ type: 'yogibo-daily-mail:height', height: document.documentElement.scrollHeight }, '*'); } catch (_) {}
  }
  if (EMBED) { document.documentElement.classList.add('embed'); window.addEventListener('resize', postHeight); }
  if (qs.get('capture') === '1') document.body.classList.add('capture');

  // ── 포맷 ──
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function comma(n){ return n == null ? '—' : Math.round(n).toLocaleString('ko-KR'); }
  function won(n){ return n == null ? '—' : comma(n) + '원'; }
  function man(n){ if (n == null) return '—'; var v = Math.round(n / 10000); return v >= 10000 ? (v / 10000).toFixed(2) + '억' : v.toLocaleString('ko-KR') + '만'; }
  function signed(v){ return v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1) + '%'; }
  var DOW = ['일','월','화','수','목','금','토'];
  function dayLabel(iso){ var p = String(iso).split('-').map(Number); return p[1] + '/' + p[2] + '(' + DOW[new Date(Date.UTC(p[0], p[1]-1, p[2])).getUTCDay()] + ')'; }
  function timeKST(iso){ return new Date(iso).toLocaleString('ko-KR', { timeZone:'Asia/Seoul', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }); }
  // 달성률 칩 — 기준(ref, 보통 100 또는 월 경과율) 대비: 이상 정상 · 85% 이상 주의 · 그 아래 미달
  function rateChip(v, ref){
    if (v == null) return '<span class="chip na">—</span>';
    ref = ref || 100;
    var cls = v >= ref ? 'up' : v >= ref * 0.85 ? 'warn' : 'dn';
    return '<span class="chip ' + cls + ' tnum">' + v.toFixed(1) + '%</span>';
  }
  function bar(v, mark, color){
    var w = Math.max(0, Math.min(100, v || 0));
    return '<div class="bar"><i style="width:' + w + '%;background:' + color + '"></i>' + (mark != null ? '<span class="mk" style="left:' + Math.min(100, mark) + '%"></span>' : '') + '</div>';
  }
  function errBox(sec){ return '<div class="err">이 섹션을 불러오지 못했습니다 — ' + esc(sec && sec.error) + '</div>'; }

  // ── ① 어제 한눈에 — 매출 타일 · 목표 대비(온라인 몰별/오프라인 매장별) · 경보 ──
  //   타일은 원장에서 직접(d.타일) — 어떤 날짜를 골라도 나온다. 화면에서는 "기간 보기"로 시작~종료 합계도 볼 수 있다(메일 캡처엔 조작줄 없음).
  //   경보는 어제 기준이라 과거 날짜를 조회하면 빠진다.
  function renderTop(d){
    var al = d.경보 && !d.경보.error ? d.경보 : null;
    var h = '<div class="card"><div class="card-head"><h2><span class="no">1</span> 어제 한눈에</h2><span class="sub">매출은 이카운트 기준(확정)' + (al ? ' · 경보는 9개 항목 자동 점검' : '') + '</span>' +
      '<span class="range-tools">기간 보기 <input type="date" id="r-s" max="' + yday() + '" value="' + esc(d.기준일) + '"> ~ <input type="date" id="r-e" max="' + yday() + '" value="' + esc(d.기준일) + '">' +
      ' <button type="button" id="r-go">적용</button> <button type="button" id="r-7">최근 7일</button> <button type="button" id="r-m">이번 달</button> <button type="button" id="r-reset">기준일로</button></span></div>';
    h += '<div id="tiles">' + (d.타일 && d.타일.ok ? renderTiles(d.타일.data) : d.타일 ? errBox(d.타일) : '') + '</div>';
    h += renderTarget(d.매출);
    if (d.경보 && d.경보.error) h += errBox(d.경보);

  }
  // 타일 — 하루면 "전주 동요일 대비", 기간이면 "직전 N일 대비"(한 달 통째면 "전월 대비")
  function renderTiles(t){
    var one = t.일수 === 1;

      '<div class="k"><p class="kl">온라인</p><div class="kv tnum">' + won(m.온라인) + '</div><div class="kd">' + chgLine(m.온라인_변화_pct) + ' · 공동구매 제외</div></div>' +

  // 기간 보기 — 타일만 다시 불러온다(아래 표·경보는 기준일 그대로)
  function yday(){ return new Date(Date.now() + 9 * 3600e3 - 86400e3).toISOString().slice(0, 10); } // 한국 기준 어제
  function loadTiles(s, e){

    box.style.opacity = '.5';
    fetch('/api/daily-mail/tiles?start=' + s + '&end=' + e, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
      box.style.opacity = '';

  // 목표 출처 표시 — 등록값은 표시 없음, * = 시스템 미등록이라 MD 공유 목표표 값, † = 예전 기본값(config)
  function srcMark(r){ return r.목표출처 === '예비' ? '<sup class="fb">*</sup>' : r.목표출처 === '기본값' ? '<sup class="fb">†</sup>' : ''; }

  // ── ① 목표 대비 매출 — 온라인 몰별 · 오프라인 매장별 (어제 한눈에 안) ──
  function renderTarget(sec){

  // 샐리필 — 오프라인 표 아래(왼쪽 온라인 표가 길어 비는 자리). 거래처별 어제·월 누적, 목표는 아직 없음.
  function renderSally(sf, head, el){

  // 샐리필 일별 팝업 — 이번 달 1일 ~ 기준일. 일별 합계(거래처별 칸) + 주문 내역. 메일 캡처(?capture=1)에서는 버튼째 숨는다.

        '<td class="r tnum">' + comma(d.수량) + '</td><td class="r tnum"><b>' + won(d.합계) + '</b></td></tr>';

  // ── ② KPI ──
  // 비어 있는 칸은 누구 몫인지 보이게 — 온라인팀이 올리는 값은 "온라인팀 업데이트 전", 시스템이 가져오는 값은 "수집 전".

  function kpiRows(list, teamKeys){
    return list.map(function(x){

  }
  function paceBlock(p){
    if (!p || !p.월목표) return '<p class="note">이번 달 목표가 등록되지 않아 진척을 낼 수 없습니다.</p>';

      '<div class="k"><p class="kl">누적 순매출 / 월 목표</p><div class="kv tnum">' + won(p.누적순매출) + '</div><div class="kd tnum">목표 ' + won(p.월목표) + ' · ' + rateChip(p.달성률) + '</div></div>' +
      '<div class="k"><p class="kl">페이스 대비 (' + p.집계일수 + '/' + p.월일수 + '일)</p><div class="kv tnum">' + (p.페이스대비 != null ? p.페이스대비.toFixed(1) + '%' : '—') + '</div><div class="kd tnum">기대 ' + won(p.페이스기대) + '</div></div>' +

      '</div>' + bar(p.달성률, elapsed, p.달성률 >= elapsed ? 'var(--good)' : 'var(--bad)');
  }
  // 광고 — 매체별 어제·월 누적. 효율은 광고비 ÷ 온라인 매출(이카운트)로 보인다(매체 전환매출은 중복 포함이라 참고).
  function renderAds(sec, onSales){
    if (!sec) return '';
    if (!sec.ok) return '<h3 class="sub-h">광고</h3>' + errBox(sec);
    var a = sec.data;
    if (!a.매체.length) return '<h3 class="sub-h">광고</h3><p class="note">어제·이번 달 광고 집계가 없습니다.</p>';
    var tr = function(r, sum){
      return '<tr' + (sum ? ' class="sum"' : '') + '><td>' + esc(r.매체) + '</td><td class="r tnum">' + won(r.어제광고비) + '</td><td class="r tnum">' + comma(r.클릭) + '</td>' +
        '<td class="r tnum">' + (r.CPC != null ? won(r.CPC) : '—') + '</td><td class="r tnum">' + comma(r.전환) + '</td><td class="r tnum">' + comma(r.전환매출) + '</td>' +
        '<td class="r tnum">' + comma(r.누적광고비) + '</td></tr>';
    };
    var ratio = function(spend, sales){ return sales > 0 ? (spend / sales * 100).toFixed(1) + '%' : '—'; };
    var t = a.합계;
    return '<h3 class="sub-h">광고 — 매체별 <span class="note-in">광고비 ÷ 온라인 매출: 어제 <b>' + ratio(t.어제광고비, onSales && onSales.어제) + '</b> · 월 누적 <b>' + ratio(t.누적광고비, onSales && onSales.누적) + '</b></span></h3>' +
      '<div class="twrap"><table class="t"><thead><tr><th>매체</th><th class="r">어제 광고비</th><th class="r">클릭</th><th class="r">CPC</th><th class="r">전환</th><th class="r">전환매출(원, 매체 집계)</th><th class="r">월 누적 광고비(원)</th></tr></thead><tbody>' +
      a.매체.map(function(r){ return tr(r, false); }).join('') + tr(t, true) + '</tbody></table></div>' +
      '<p class="note">' + esc(a.기준) + ' · 광고비 비중의 매출은 이카운트 온라인 합계(공동구매 제외)입니다.</p>';
  }

  var adSec = null, onSales = null, baseDate = null; // render() 가 채운다 — KPI 카드 안에 광고 표를 그릴 때 쓴다
  function renderKpi(sec){
    var h = '<div class="card"><div class="card-head"><h2><span class="no">2</span> 자사몰 / 스마트스토어 KPI · 광고</h2><span class="sub">어제 실적 vs 일 목표(월 목표 ÷ 일수) · 일일 퍼널 점검 화면과 같은 계산</span></div>';
    if (!sec.ok) return h + errBox(sec) + renderAds(adSec, onSales) + '</div>'; // KPI 가 실패해도 광고 표는 따로 보인다
    // 온라인팀이 올릴 값이 비면 표 칸에만 "온라인팀 업데이트 전"으로 표시한다(위쪽 안내 상자는 두지 않음 — 사용자 요청 2026-10-01)
    var k = sec.data;
    h += '<div class="two">' +
      '<div class="ch"><h3>자사몰</h3>' + paceBlock(k.mall.월진척) +
        '<table class="t"><thead><tr><th>지표</th><th class="r">어제 실적</th><th class="r">일 목표</th><th class="r">달성률</th></tr></thead><tbody>' + kpiRows(k.mall.지표, ['상품조회', '장바구니', '주문서작성']) + '</tbody></table></div>' +
      '<div class="ch"><h3>스마트스토어</h3>' + paceBlock(k.ss.월진척) +
        '<table class="t"><thead><tr><th>지표</th><th class="r">어제 실적</th><th class="r">일 목표</th><th class="r">달성률</th></tr></thead><tbody>' + kpiRows(k.ss.지표, ['유입', '구매율']) + '</tbody></table></div>' +
      '</div>';
    h += renderAds(adSec, onSales);
    h += '<p class="note">구매전환율·구매율·객단가·건당 매출의 목표는 기준월 벤치마크입니다. 순매출: 자사몰 = Cafe24 통계, 스토어 = 이카운트 원장(반품 차감). ' +
      '상품조회·장바구니·주문서(이프두)와 스토어 유입(비즈어드바이저)은 온라인팀이 올리는 값입니다.</p>';
    return h + '</div>';
  }

  // ── ③ 오프라인 좌수 ──
  function renderJwasu(sec){
    var h = '<div class="card"><div class="card-head"><h2><span class="no">3</span> 오프라인 좌수 일일 체크</h2>';
    if (!sec.ok) return h + '</div>' + errBox(sec) + '</div>';
    var j = sec.data, el = j.월경과율;
    h += '<span class="sub">월 경과 ' + el.toFixed(0) + '% — 달성률이 경과율보다 낮으면 페이스 미달</span></div>';
    // 매장 매출·목표는 맨 위 "어제 한눈에"에 있다 — 여기는 좌수(상담 인원)만. 좌수당 매출 = 월 누적 매출 ÷ 월 누적 좌수
    var row = function(r, sum){
      var per = r.누적좌수 ? r.누적매출 / r.누적좌수 : null;
      return '<tr' + (sum ? ' class="sum"' : '') + '><td>' + esc(r.매장) + '</td><td class="r tnum">' + comma(r.인원) + '</td>' +
        '<td class="r tnum"><b>' + comma(r.어제좌수) + '</b></td><td class="r tnum">' + comma(r.어제주문) + '</td>' +
        '<td class="r tnum">' + comma(r.누적좌수) + ' / ' + comma(r.목표좌수) + '</td><td class="r">' + rateChip(r.좌수달성률, el) + '</td>' +
        '<td class="r tnum">' + (per != null ? won(per) : '—') + '</td></tr>';
    };
    h += '<div class="twrap"><table class="t"><thead><tr><th>매장</th><th class="r">인원</th><th class="r">어제 좌수</th><th class="r">어제 주문</th>' +
      '<th class="r">월 누적 좌수 / 목표</th><th class="r">좌수 달성률</th><th class="r">좌수당 매출(월)</th></tr></thead><tbody>' +
      j.매장.filter(function(r){ return r.인원 > 0; }).map(function(r){ return row(r, false); }).join('') + row(j.합계, true) + '</tbody></table></div>';
    h += renderStaff(j.직원 || [], el);
    h += '<p class="note">' + esc(j.기준) + ' · 매장 매출의 목표 대비는 맨 위 "어제 한눈에"에 있습니다.</p>';
    return h + '</div>';
  }

  // 직원별 좌수 — 메일 그림이 길어지지 않게 두 칸으로 나눈다(앞 절반 | 뒤 절반, 매장 순서 유지)
  function renderStaff(list, el){
    if (!list.length) return '';
    var head = '<thead><tr><th>매장</th><th>직원</th><th class="r">어제</th><th class="r">월 누적 / 목표</th><th class="r">달성률</th></tr></thead>';
    var tr = function(r, i, arr){
      var sameStore = i > 0 && arr[i - 1].매장 === r.매장; // 같은 매장이 이어지면 매장명은 첫 줄에만
      return '<tr><td>' + (sameStore ? '' : esc(r.매장)) + '</td><td>' + esc(r.직원) + (r.역할 ? ' <span class="note-in">' + esc(r.역할) + '</span>' : '') + '</td>' +
        '<td class="r tnum"><b>' + comma(r.어제좌수) + '</b></td><td class="r tnum">' + comma(r.누적좌수) + ' / ' + comma(r.목표좌수) + '</td><td class="r">' + rateChip(r.달성률, el) + '</td></tr>';
    };
    var half = Math.ceil(list.length / 2), a = list.slice(0, half), b = list.slice(half);
    var table = function(rows){ return '<table class="t">' + head + '<tbody>' + rows.map(tr).join('') + '</tbody></table>'; };
    return '<h3 class="sub-h">직원별 좌수 <span class="note-in">' + list.length + '명 · 월 누적 좌수 큰 순(매장 순서는 위 표와 같음)</span></h3>' +
      '<div class="two staff"><div>' + table(a) + '</div><div>' + (b.length ? table(b) : '') + '</div></div>';
  }

  // ── ④ 재고 주의 (MD 양식) ──
  // 주의 품목 기준 — 무엇이 들어가고 무엇이 빠지는지, 계산식·예시·순서까지(받는 사람이 "이건 왜?" 하지 않게)
  function stockRule(s){
    var per = String((s.기준 || {}).판매기간 || ''), m = per.match(/(\d{4}-\d{2}-\d{2})\s*~\s*(\d{4}-\d{2}-\d{2})/);
    var span = m ? dayLabel(m[1]).replace(/\(.\)/, '') + '~' + dayLabel(m[2]).replace(/\(.\)/, '') : '최근 90일';
    var both = (s.기준 || {}).basis !== 'online';
    var at = s.재고갱신 ? timeKST(s.재고갱신) + ' 기준' : '조회 시점';
    return '<div class="rule-box"><b class="rb-t">📋 주의 품목은 이렇게 뽑습니다</b>' +
      '<ol>' +
      '<li><b>3개월 예상판매량</b> = 최근 90일(' + esc(span) + ') 실제 판매 수량 — ' + (both ? '온라인 + 오프라인 합산' : '온라인만') + ', 반품 차감. 앞으로 3개월도 같은 속도로 팔린다고 가정합니다.</li>' +
      '<li><b>3개월이후 재고수량</b> = 현재고 − 3개월 예상판매량</li>' +
      '<li><b>주의</b> = 3개월이후 재고수량이 <b>마이너스(0 미만)</b>인 품목만 — 지금 재고로는 3개월을 버티지 못한다는 뜻입니다. <span class="rb-ex">예) 현재고 50 − 예상 51 = <b>−1</b> → 주의</span></li>' +
      '<li><b>순서</b> = −1에 가까운 품목(곧 모자라기 시작)부터 → 많이 모자라는 품목 순</li>' +
      '</ol>' +
      '<div class="rb-cols"><div><b>목록에 안 나오는 경우</b><ul>' +
      '<li>3개월이후 재고수량이 0 이상 — 3개월 이상 버팀(정상)</li>' +
      '<li>현재고가 0 이하 — 이미 품절. 주의 대신 아래 <b>품절</b> 줄에 건수로 따로 표시</li>' +
      '<li>최근 90일 판매가 없는 품목 — 예상판매량이 0이라 계산 대상 아님</li>' +
      '<li>물류센터 재고 목록에 없는 품목 — 리필 비즈·부직포백·배송비 등</li>' +
      '</ul></div><div><b>숫자 읽는 법</b><ul>' +
      '<li><b>커버</b> = 커버 단품 + 같은 색 본품 판매 합계(본품 1개에 커버 1장). 등급·EPP 커버 재고도 같은 줄에 합산</li>' +
      '<li><b>이너</b> = 사이즈별로 전 등급(스탠다드·프리미엄·EPP) 합산 — 표에 "전 등급 합산"으로 표시</li>' +
      '<li><b>현재고</b> = 물류센터 실시간 재고(' + esc(at) + ') · <b>판매</b> = 이카운트 출고 기준</li>' +
      '</ul></div></div></div>';
  }

  function renderStock(sec){
    var h = '<div class="card"><div class="card-head"><h2><span class="no">4</span> 재고 현황 — 주의 품목</h2>';
    if (!sec.ok) return h + '</div>' + errBox(sec) + '</div>';
    var s = sec.data;
    h += '<span class="sub">* 주의 상품만 리스트업 · 주의 <b>' + s.주의.length + '</b>품목 · 품절 ' + s.품절.건수 + '품목' +
      (s.재고갱신 ? ' · 재고 ' + timeKST(s.재고갱신) + ' 기준' : '') + '</span></div>';
    h += stockRule(s);
    if (!s.주의.length) h += '<p class="note">3개월 안에 재고가 모자랄 품목이 없습니다.</p>';
    else h += '<div class="twrap"><table class="t stock"><thead><tr><th>품목코드</th><th>상품명</th><th>색상명</th><th>현재고</th><th>3개월예상판매량</th><th>3개월이후 재고수량</th><th>발주판단</th></tr></thead><tbody>' +
      s.주의.map(function(x){
        var inner = x.분류 === '이너';
        return '<tr><td class="tnum">' + esc(x.품목코드) + '</td><td class="l">' + esc(x.상품명) + (inner ? '<span class="inner-tag">전 등급 합산</span>' : '') + '</td>' +
          '<td class="l">' + esc(inner ? '' : x.색상명) + '</td><td class="tnum">' + comma(x.현재고) + '</td><td class="tnum">' + comma(x.예상판매_3개월) + '</td>' +
          '<td class="tnum neg">' + comma(x.재고_3개월후) + '</td><td class="judge">주의</td></tr>';
      }).join('') + '</tbody></table></div>';
    if (s.품절.건수) h += '<div class="soldout"><b>품절</b> (현재고 0 이하인데 최근 90일 판매 있음) <b>' + s.품절.건수 + '</b>품목 — 수요 큰 순: ' +
      s.품절.수요상위.slice(0, 8).map(function(x){ return esc(x.상품명 + (x.색상명 && x.분류 !== '이너' ? ' ' + x.색상명 : '')) + ' <span class="tnum">' + comma(x.예상판매_3개월) + '</span>'; }).join(' · ') +
      (s.품절.건수 > 8 ? ' 외' : '') + '</div>';
    h += '<p class="note">' + esc(s.기준.예상) + ' · 판매 기준: ' + esc(s.기준.판매) + ' · ' + esc(s.기준.판매기간) + '<br>' + esc(s.기준.묶음) + ' · 발주 기준 변경은 MD 결정 사항입니다.</p>';
    return h + '</div>';
  }

  function render(d){
    document.getElementById('hd-date').textContent = dayLabel(d.기준일) + ' 기준';
    // 원장별 마지막 적재 — 다운로드 PC가 꺼진 날에도 "언제 숫자인지" 보이게
    var ld = d.적재 || {}, ldTxt = [['온라인', ld.온라인], ['샐리필', ld.샐리필], ['오프라인', ld.오프라인]]
      .map(function(x){ return x[0] + ' ' + (x[1] ? timeKST(x[1]) : '—'); }).join(' · ');
    document.getElementById('hd-fresh').innerHTML = '생성 ' + esc(timeKST(d.생성시각)) + ' · 어제까지 확정된 데이터' + (d.캐시 ? ' · 10분 캐시' : '') +
      '<br><span class="note-in">데이터 적재 — ' + esc(ldTxt) + '</span>';
    adSec = d.광고 || null; baseDate = d.기준일;
    onSales = d.매출 && d.매출.ok ? d.매출.data.온라인.합계 : null;
    document.getElementById('root').innerHTML = renderTop(d) + renderKpi(d.kpi) + renderJwasu(d.좌수) + renderStock(d.재고);
    bindRange(d);
    document.body.setAttribute('data-date', d.기준일); // 발송 스크립트가 기준일을 읽는 곳(위쪽 날짜 칸은 없앴다)
    document.title = '일일 모니터링 ' + d.기준일 + ' · 요기보';
  }

  function load(fresh){
    var p = new URLSearchParams();
    ['date','basis'].forEach(function(k){ if (qs.get(k)) p.set(k, qs.get(k)); });
    if (fresh || qs.get('fresh') === '1') p.set('fresh', '1');
    document.body.removeAttribute('data-ready');
    document.getElementById('hd-fresh').textContent = '불러오는 중…';
    return fetch('/api/daily-mail?' + p.toString(), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || '데이터를 불러오지 못했습니다');
        render(j);
      })
      .catch(function(e){
        document.getElementById('root').innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>';
        document.getElementById('hd-fresh').textContent = '불러오기 실패';
        document.body.setAttribute('data-error', '1');
      })
      .then(function(){ return document.fonts && document.fonts.ready; })
      .then(function(){ document.body.setAttribute('data-ready', '1'); postHeight(); setTimeout(postHeight, 300); });
  }

  // 조작줄 — 주소를 바꿔 다시 불러온다(새로 고침해도 같은 화면)
  document.getElementById('f-basis').value = qs.get('basis') || '';
  function go(fresh){
    // 기준일은 주소(?date=)로만 — 화면의 날짜 칸은 "기간 보기" 하나만 둔다(두 개면 헷갈린다, 사용자 요청 2026-10-01)
    var b = document.getElementById('f-basis').value;
    if (b) qs.set('basis', b); else qs.delete('basis');
    qs.delete('fresh');
    history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs.toString() : ''));
    load(fresh);
  }
  document.getElementById('f-basis').onchange = function(){ go(false); };
  document.getElementById('f-fresh').onclick = function(){ go(true); };
  load(false);
})();
</script>
</body>
</html>
